[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "w2c-e1"
version = "0.1.0"
description = "E1 frozen representation probing for When2Call (Ettin encoder vs decoder)"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "torch>=2.1",
  "transformers>=4.40",
]

[tool.setuptools.packages.find]
where = ["src"]
